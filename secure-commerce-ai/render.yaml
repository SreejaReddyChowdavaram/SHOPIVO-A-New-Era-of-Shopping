# ==============================================================================
# SHOPIVO — Render Infrastructure Blueprint Specification (render.yaml)
# ==============================================================================
# This blueprint defines the three core Render resources:
#   1. shopivo-db       : Managed PostgreSQL Database
#   2. shopivo-backend  : Spring Boot 3.4 / Java 21 LTS Docker Web Service
#   3. shopivo-frontend : React 19 / Vite Static Site
# ==============================================================================

services:
  # ─────────────────────────────────────────────────────────────
  # 1. BACKEND SERVICE: Docker Web Service
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: shopivo-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    rootDir: backend
    plan: standard
    region: oregon
    healthCheckPath: /api/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database connection parameters (populated automatically from managed database)
      - key: DB_URL
        fromDatabase:
          name: shopivo-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: shopivo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shopivo-db
          property: password
      # Production Security Tokens
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      # CORS: Set to your actual frontend Render URL
      - key: CORS_ORIGINS
        value: https://shopivo-frontend.onrender.com
      # Razorpay Gateway Configuration (Secrets should be entered via Render Dashboard)
      - key: RAZORPAY_MODE
        value: TEST
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ─────────────────────────────────────────────────────────────
  # 2. FRONTEND SERVICE: React / Vite Static Site
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: shopivo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://shopivo-backend.onrender.com/api

databases:
  # ─────────────────────────────────────────────────────────────
  # 3. DATABASE: Render Managed PostgreSQL
  # ─────────────────────────────────────────────────────────────
  - name: shopivo-db
    databaseName: securecommerce
    user: postgres
    plan: standard
    region: oregon

