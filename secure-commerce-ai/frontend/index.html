<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/shopivo-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Shopivo — A New Era of Shopping</title>
    <meta name="description" content="Shopivo is a modern e-commerce marketplace featuring secure checkout, account protection, and intelligent fraud detection." />

    <!-- Google Fonts: Inter
         Loaded here (not in CSS) to avoid PostCSS @import order restrictions.
         preconnect hints tell the browser to open DNS/TLS connections early. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Anti-flash inline script: immediately sets theme before paint -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('secure-ai-theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
