<!DOCTYPE html>
<html>
<head>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const email = params.get('email') || 'priya.nair@shopivo.demo';
  const role = params.get('role') || 'CUSTOMER';
  const name = params.get('name') || 'Priya';

  if (token) {
    localStorage.setItem('sc_access_token', token);
    localStorage.setItem('sc_user', JSON.stringify({
      id: 205,
      email: email,
      firstName: name,
      lastName: 'Nair',
      role: role,
      enabled: true,
      loginCount: 5,
      lastLoginIp: '127.0.0.1',
      lastLoginLocation: 'Localhost / Development Environment'
    }));
    window.location.href = '/customer/login-activity';
  } else {
    document.body.innerText = 'No token provided';
  }
</script>
</head>
<body style="background:#050505; color:white;">Authenticating...</body>
</html>
