# ─────────────────────────────────────────────────────────────
# SHOPIVO — Production Spring Boot Profile Configuration
# Profile: prod
# ─────────────────────────────────────────────────────────────

spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.securecommerce.platform: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: ERROR

app:
  jwt:
    # Production strictly requires an externalized JWT_SECRET environment variable
    secret: ${JWT_SECRET}

  razorpay:
    # Production payment gateway configuration — defaults safely to TEST until explicit dual-confirmation
    mode: ${RAZORPAY_MODE:TEST}
    live-enabled: ${RAZORPAY_LIVE_ENABLED:false}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: ${RAZORPAY_CURRENCY:INR}
